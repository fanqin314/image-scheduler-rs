[workspace]
members = ["scheduler-core"]
resolver = "2"

[package]
name = "image-scheduler-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.24"
anyhow = "1.0"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
multipart = "0.18"
bytes = "1"
base64 = "0.21"
num = "0.4"
imageproc = "0.23"
tempfile = "3"
ffmpeg-sidecar = "1.0"
rayon = "1"
scheduler-core = { path = "scheduler-core" }